<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hill Runner</title>
  <!-- CrazyGames SDK v3 — must be a classic script, loaded before the game
       module: src/core/Platform.js awaits window.CrazyGames.SDK.init() at boot. -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="menu-root"></div>

  <div id="pause-overlay" class="overlay hidden">
    <div class="panel">
      <h2>Paused</h2>
      <button id="btn-resume" class="btn primary">Resume</button>
      <button id="btn-restart" class="btn">Restart</button>
      <!-- No mute button on CrazyGames: their game setting outranks any
           in-game toggle, so the site's own control is the only one. main.js
           null-guards #btn-mute for exactly this. -->
      <button id="btn-quit" class="btn">Quit to Level Select</button>
    </div>
  </div>

  <div id="result-overlay" class="overlay hidden">
    <div class="panel" id="result-panel"></div>
  </div>

  <div id="toast" class="hidden"></div>

  <div id="boot-error" class="overlay hidden">
    <div class="panel">
      <h2 id="boot-error-title"></h2>
      <div class="stat-line" id="boot-error-msg"></div>
    </div>
  </div>

  <!-- Classic script, loaded first: it must survive whatever breaks the modules. -->
  <script src="src/boot-guard.js"></script>
  <script src="lib/matter.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
