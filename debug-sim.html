<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>debug sim</title></head>
<body>
<pre id="out">running...</pre>
<script src="lib/matter.min.js"></script>
<script type="module">
const lines = [];
const log = m => { lines.push(m); document.getElementById('out').textContent = lines.join('\n'); };
try {
  const { PhysicsWorld } = await import('./src/physics/PhysicsWorld.js');
  const { Terrain } = await import('./src/physics/Terrain.js');
  const { Obstacles } = await import('./src/physics/Obstacles.js');
  const { Car } = await import('./src/physics/Car.js');
  const { getLevel } = await import('./src/data/levels.js');
  const { getStatsAtTiers } = await import('./src/data/vehicles.js');

  const STEP = 1000 / 60;
  const params = new URLSearchParams(location.search);
  const worldId = Number(params.get('world') || 3);
  const levelIndex = Number(params.get('level') || 2);
  const tFrom = Number(params.get('from') || 0);
  const tiers = {
    stock: { engine: 0, suspension: 0, tires: 0, brakes: 0 },
    t1: { engine: 1, suspension: 0, tires: 0, brakes: 0 },
    t2: { engine: 2, suspension: 1, tires: 1, brakes: 1 },
    t3: { engine: 3, suspension: 2, tires: 2, brakes: 2 },
    max: { engine: 3, suspension: 3, tires: 3, brakes: 3 },
  }[params.get('tier') || 't2'];
  const vehId = params.get('veh') || 'pickup';

  const level = getLevel(worldId, levelIndex);
  const pw = new PhysicsWorld();
  new Terrain(level, pw);
  const obstacles = new Obstacles(level, pw);
  const stats = getStatsAtTiers(vehId, tiers);
  const car = new Car(stats, level.startX, level.startY);
  car.addTo(pw);

  let stallTime = 0, reverseUntil = -1;
  for (let i = 0; i < 60 * 60; i++) {
    const t = i / 60;
    const now = pw.timestamp();
    const grounded = car.groundedWheelCount(now) > 0;
    const angle = car.normAngle();

    let waiting = false, backOff = false, committed = false, wball = null;
    for (const it of obstacles.items) {
      if (it._cleared) continue;
      if (it.type === 'ball') {
        const d = it.ax - car.position().x;
        const stopZone = it.sweep + 130 + Math.max(0, car.velocity().x) * 30;
        if (d < 40 || d > stopZone) continue;
        if (d < it.sweep + 260 && Math.abs(it.ball.position.x - it.ax) < 50 && it.ball.velocity.x > 0.5) it._cleared = true;
        else { waiting = true; wball = it; }
      } else if (it.type === 'press') {
        const d = it.cx - car.position().x;
        if (d < 40 || d > Math.max(260, 170 + car.velocity().x * 30)) continue;
        const openFrac = (it.groundY - 14 - (it.body.position.y + it.h / 2)) / (it.clearance - 14);
        if (openFrac > 0.5 && it.body.plugin.rising) it._cleared = true;
        else { waiting = true; if (d < 130) backOff = true; }
      } else if (it.type === 'rockfall') {
        const d = it.x - car.position().x;
        const stopZone = 170 + Math.max(0, car.velocity().x) * 30;
        if (d < 40 || d > stopZone) continue;
        if (!it.rock.isStatic && it.rock.position.y > it.groundY + 60) { it._cleared = true; committed = true; }
        else { waiting = true; if (d < 300) backOff = true; }
      } else if (it.type === 'fireball' || it.type === 'arrows') {
        const d = it.x - car.position().x;
        const stopZone = 220 + Math.max(0, car.velocity().x) * 32;
        if (d < 40) continue;
        if (d > stopZone && !it._seen) continue;
        it._seen = true;
        if (d > 420 && car.velocity().x < 3) continue;
        let go;
        if (it.type === 'fireball') {
          const fb = it.ball;
          const vx = car.velocity().x;
          const frac = ((now / 1000) / it.period + it.phase) % 1;
          const dive = !fb.isStatic && fb.velocity.y > 0.5 && fb.position.y > it.groundY + 30;
          go = (dive && d < 380 && vx > 11)
            || (fb.isStatic && (1 - frac) * it.period > 1.15 && d < 420 && (vx < 6 || vx > 11));
        } else {
          const p = ((now / 1000) / it.period + it.phase) % 1;
          go = p > it.rainFrac && p < it.rainFrac + 0.15;
        }
        if (go && car.velocity().x > -0.5) { it._cleared = true; committed = true; }
        else { waiting = true; if (d < 310) backOff = true; }
      }
    }

    if (committed) reverseUntil = -1;
    let inp = { gas: false, brake: false };
    if (t < reverseUntil) inp.brake = true;
    else if (!grounded) {
      if (angle > 0.22) inp.gas = true;
      else if (angle < -0.22) inp.brake = true;
    } else if (waiting) {
      inp.brake = car.velocity().x > 1.0;
      if (backOff && !inp.brake) reverseUntil = t + 0.5;
      stallTime = 0;
    } else {
      inp.gas = true;
      if (car.speed() < 0.6) {
        stallTime += 1 / 60;
        if (stallTime > 1.2) { reverseUntil = t + 1.4; stallTime = 0; }
      } else stallTime = 0;
    }
    const verdict = car.update(inp, 1 / 60, now);
    pw.step(STEP);
    const p = car.position();
    if (t >= tFrom && i % 6 === 0) {
      const bi = wball || obstacles.items.find(x => x.type === 'ball');
      const bs = bi ? ` ballDx=${(bi.ball.position.x - bi.ax).toFixed(0)} ballVx=${bi.ball.velocity.x.toFixed(1)} cleared=${!!bi._cleared}` : '';
      log(`t=${t.toFixed(2)} x=${p.x.toFixed(0)} y=${p.y.toFixed(0)} vx=${car.velocity().x.toFixed(1)} vy=${car.velocity().y.toFixed(1)} g=${grounded ? 1 : 0} a=${angle.toFixed(2)} wait=${waiting}${bs}`);
    }
    if (verdict) { log(`${verdict.toUpperCase()} at t=${t.toFixed(2)} x=${p.x.toFixed(0)} y=${p.y.toFixed(0)}`); break; }
    if (p.y > level.deathY) { log(`FELL at t=${t.toFixed(2)} x=${p.x.toFixed(0)} y=${p.y.toFixed(0)}`); break; }
    if (p.x > level.finishX) { log(`WIN at t=${t.toFixed(2)}`); break; }
  }
  log('DONE');
} catch (e) { log('FATAL: ' + e.message + '\n' + e.stack); }
</script>
</body>
</html>
