<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>infinite mode test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="menu-root"></div>
  <div id="pause-overlay" class="overlay hidden">
    <div class="panel">
      <button id="btn-resume" class="btn primary">Resume</button>
      <button id="btn-restart" class="btn">Restart</button>
      <button id="btn-quit" class="btn">Quit</button>
    </div>
  </div>
  <div id="result-overlay" class="overlay hidden"><div class="panel" id="result-panel"></div></div>
  <div id="toast" class="hidden"></div>
  <pre id="testlog" style="position:fixed; z-index:99; left:0; top:0; background:#fff; font-size:10px; max-width:45%;"></pre>

  <script>
    // Fresh save with a coin purse for the unlock test and a maxed pickup so
    // the gas-only bot represents a mid-game player, not a stalled stock car.
    localStorage.setItem('hillrunner_save_v1', JSON.stringify({
      coins: 1000,
      vehicles: { pickup: { owned: true, upgrades: { engine: 3, suspension: 3, tires: 3, brakes: 3 } } },
    }));
  </script>
  <script src="lib/matter.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script type="module">
    const logEl = document.getElementById('testlog');
    const log = (s) => { logEl.textContent += s + '\n'; };
    const wait = (ms) => new Promise((res) => setTimeout(res, ms));

    try {
      await wait(300);
      const { screens } = await import('./src/core/ScreenManager.js');
      const { saveData } = await import('./src/core/SaveData.js');
      const inf = await import('./src/data/infinite.js');
      const { PhysicsWorld } = await import('./src/physics/PhysicsWorld.js');
      const { Obstacles } = await import('./src/physics/Obstacles.js');
      const { Terrain } = await import('./src/physics/Terrain.js');

      // --- 1. Generator soak: every theme, 40 chunks, rising difficulty ---
      const ranges = {};
      for (const theme of inf.INFINITE_THEMES) {
        const rng = inf.mulberry32(1234 + theme.id);
        const profile = inf.makeElevation(theme.id, 4242 + theme.id);
        let x = 0, y = 600, minY = 600, maxY = 600, obstacles = 0;
        let maxGrade = 0;
        let bad = null;
        for (let i = 0; i < 40 && !bad; i++) {
          const gen = i === 0
            ? inf.generateIntroChunk(theme.id, rng, profile)
            : inf.generateChunk(theme.id, x, y, inf.difficultyAt(x), rng, profile);
          for (const chain of gen.chains) {
            let px = -Infinity, py = null;
            for (const pt of chain) {
              if (!isFinite(pt.x) || !isFinite(pt.y)) bad = `NaN point in chunk ${i}`;
              if (pt.x < px - 0.01) bad = `x not monotonic in chunk ${i}`;
              if (py !== null && pt.x > px + 1) {
                maxGrade = Math.max(maxGrade, Math.abs(pt.y - py) / (pt.x - px));
              }
              px = pt.x; py = pt.y;
              minY = Math.min(minY, pt.y);
              maxY = Math.max(maxY, pt.y);
            }
          }
          obstacles += gen.obstacles.length;
          // Every chunk must build real physics bodies without throwing.
          const world = new PhysicsWorld();
          const t = new Terrain({ chains: gen.chains, walls: gen.walls, friction: 0.85 }, world, { startWall: false });
          const o = new Obstacles({ chains: gen.chains, obstacles: gen.obstacles, deathY: gen.maxY + 420 }, world);
          o.destroy(); t.destroy(); world.destroy();
          x = gen.endX; y = gen.endY;
        }
        const range = Math.round(maxY - minY);
        ranges[theme.id] = range;
        // Coherent noise should push far above AND below the 600 baseline, and
        // every laid segment must stay under the ~40° friction limit (0.84).
        if (!bad && (minY > 450 || maxY < 750)) bad = `terrain barely leaves the baseline (${Math.round(minY)}..${Math.round(maxY)})`;
        if (!bad && maxGrade > 0.85) bad = `segment steeper than drivable (${maxGrade.toFixed(2)})`;
        log(`gen theme ${theme.id}: ${Math.round(x / 1000)}k px, ${obstacles} obs, y ${Math.round(minY)}..${Math.round(maxY)} range ${range}, grade≤${maxGrade.toFixed(2)} ${bad ? 'FAIL ' + bad : 'OK'}`);
      }
      // Bumpiness ordering: Farm is the wildest, Factory the flattest.
      log('bumpiness: farm ' + ranges[1] + ' vs factory ' + ranges[6]
        + (ranges[1] > 500 && ranges[6] < ranges[1] ? ' OK' : ' FAIL'));

      // --- 2. Full bot run on Farm ∞ through the real screen ---
      const { input } = await import('./src/core/InputManager.js');
      input.getState = () => ({ gas: true, brake: false });
      screens.show('infinitegame', { themeId: 1 });
      const game = screens.screens.infinitegame;
      log('enter: ' + screens.currentName + (screens.currentName === 'infinitegame' ? ' OK' : ' FAIL'));

      // Milestone payout, deterministically: teleport progress past 500m and
      // let the tracker pay out (the gas-only bot's real reach is luck).
      const coins0 = saveData.getCoins();
      game.maxX = game.level.startX + 501 * inf.PX_PER_M;
      game._trackRun(game.physics.timestamp());
      const milestoneCoins = saveData.getCoins() - coins0;
      log(`milestone payout: +${milestoneCoins} flash="${game.flash?.text}" `
        + (milestoneCoins === inf.milestoneCoins(1, 1.0) && game.flash ? 'OK' : 'FAIL'));
      // Re-crossing the same milestone must NOT pay twice.
      game._lastMilestone = 0;
      game.baseBestM = saveData.getInfiniteBest(1) > 500 ? saveData.getInfiniteBest(1) : 501;
      game._trackRun(game.physics.timestamp());
      log('no double pay: ' + (saveData.getCoins() - coins0 === milestoneCoins ? 'OK' : 'FAIL'));
      game.baseBestM = 0;

      let bodyPeak = 0;
      const Composite = Matter.Composite;
      // Drive a few seconds to exercise streaming, then cut the gas: the
      // stuck watchdog only fires on a car that's genuinely at rest (motion —
      // even without progress — resets its fuse), so park it and let the
      // teleported maxX guarantee no progress is ever recorded.
      for (let i = 0; i < 1400 && game.state === 'playing'; i++) {
        if (i === 40) input.getState = () => ({ gas: false, brake: false });
        screens.update(50); // 3 steps per call ≈ 70s of sim total
        if (i % 40 === 0 && game.physics) {
          bodyPeak = Math.max(bodyPeak, Composite.allBodies(game.physics.engine.world).length);
        }
      }
      // The parked car makes no progress past the teleported maxX, so the
      // stuck watchdog should end the run at ~12s of stillness — the test.
      const dist = Math.round(game.distM);
      // < 25s: ~2s of driving + coast-to-rest (terrain-dependent) + the 12s
      // stillness fuse. The 32s fuel tank ending the run instead would land
      // past 25s and fail this line — the watchdog must get there first.
      log(`run: ${dist}m in ${game.time.toFixed(1)}s state=${game.state} `
        + (dist >= 500 && game.state === 'failed' && game.time < 25 ? 'OK (watchdog fired)' : 'FAIL'));
      log(`streaming: peak ${bodyPeak} bodies ` + (bodyPeak > 0 && bodyPeak < 700 ? 'OK' : 'FAIL'));
      log(`chains live: ${game.level.chains.length} ` + (game.level.chains.length < 120 ? 'OK' : 'FAIL'));

      if (game.state === 'playing') game._endRun('Test stop');
      await wait(60);
      const overlayShown = !document.getElementById('result-overlay').classList.contains('hidden');
      log('results overlay: ' + (overlayShown ? 'OK' : 'FAIL'));
      const best = saveData.getInfiniteBest(1);
      log(`best recorded: ${best}m ` + (best === Math.round(game.distM) ? 'OK' : 'FAIL'));

      // --- 3. Retry resets the run ---
      game.restart();
      await wait(30);
      log('retry: state=' + game.state + ' dist=' + Math.round(game.distM)
        + (game.state === 'playing' && game.distM === 0 ? ' OK' : ' FAIL'));

      // --- 4. Quit → select screen; unlock Town with seeded coins ---
      game.quit();
      await wait(30);
      log('quit: ' + screens.currentName + (screens.currentName === 'infinite' ? ' OK' : ' FAIL'));
      const coinsBefore = saveData.getCoins();
      const okUnlock = saveData.getCoins() >= 400;
      const cards = document.querySelectorAll('#menu-root .card');
      log('select cards: ' + cards.length + (cards.length === 6 ? ' OK' : ' FAIL'));
      cards[1].click(); // Town (locked) → confirm panel
      await wait(30);
      const unlockBtn = document.querySelector('body > .overlay:not(#pause-overlay):not(#result-overlay) .btn.primary');
      log('unlock panel: ' + (unlockBtn ? 'OK' : 'FAIL'));
      if (unlockBtn) {
        unlockBtn.click();
        await wait(30);
        log('unlocked town: ' + saveData.isInfiniteUnlocked(2)
          + ' coins ' + coinsBefore + '→' + saveData.getCoins()
          + (saveData.isInfiniteUnlocked(2) && saveData.getCoins() === coinsBefore - 400 && okUnlock ? ' OK' : ' FAIL'));
      }

      // --- 5. Short spin on every unlocked-able theme (crash check) ---
      for (const theme of inf.INFINITE_THEMES) {
        screens.show('infinitegame', { themeId: theme.id });
        for (let i = 0; i < 120 && screens.screens.infinitegame.state === 'playing'; i++) {
          screens.update(50);
        }
        const g = screens.screens.infinitegame;
        log(`theme ${theme.id} spin: ${Math.round(g.distM)}m state=${g.state} OK`);
        g.quit();
        await wait(10);
      }

      log(logEl.textContent.includes('FAIL') ? 'INFINITE TEST: FAILURES ABOVE' : 'INFINITE TEST: ALL PASS');
    } catch (e) {
      log('EXCEPTION: ' + e.message + '\n' + e.stack);
    }
  </script>
</body>
</html>
